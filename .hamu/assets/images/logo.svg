  <path d="M32.62,54.63s8.3-30.07,22.5-38.68c-10.68-10.35-33.1,4.61-22.5,38.68Z" fill="url(#deglare_2)"/>
  <path d="M41.06,42.86s27.13-15.39,43.26-11.44c-.23-14.87-26.66-20.14-43.26,11.44Z" fill="url(#deglare_3)"/>

  <!-- tema ile akan (currentColor) parçalar -->
  <g>
