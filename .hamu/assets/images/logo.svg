<?php
// /.hamu/assets/images/logo.php
// Tek dosyada iki mod:
// 1) INCLUDE (inline SVG): header yok, XML prolog yok, GET beklemez, currentColor ile tema uyumlu
// 2) DOĞRUDAN (IMG src): header + XML prolog, h/c/theme GET parametreleri çalışır

$__IS_DIRECT = isset($_SERVER['SCRIPT_FILENAME']) && realpath($_SERVER['SCRIPT_FILENAME']) === realpath(__FILE__);

// ---------------------------
// Ortak yardımcılar
// ---------------------------
function _sanitize_hex6($hex) {
    $hex = trim((string)$hex);
    return (preg_match('/^[0-9a-fA-F]{6}$/', $hex)) ? strtolower($hex) : '';
}
function _attr_height_from($h, $fallback = '') {
    if ($h === null || $h === '') return $fallback;
    return ' height="' . htmlspecialchars((string)$h, ENT_QUOTES, 'UTF-8') . '"';
}

// ---------------------------
// Parametreleri topla
// ---------------------------
if ($__IS_DIRECT) {
    // IMG modu: GET parametreleri
    header('Content-Type: image/svg+xml; charset=UTF-8');

    $hParam   = isset($_GET['h']) ? (string)$_GET['h'] : '';
    $theme    = isset($_GET['theme']) ? strtolower((string)$_GET['theme']) : '';
    $cParam   = _sanitize_hex6($_GET['c'] ?? '');

    $heightAttr = _attr_height_from($hParam, '');
    // Renk belirleme: c > theme > default
    if ($cParam !== '') {
        $colorStyle = ' style="color:#' . $cParam . '"';
    } else {
        if ($theme === 'dark') {
            $colorStyle = ' style="color:#f8f9fa"';
        } elseif ($theme === 'light') {
            $colorStyle = ' style="color:#212529"';
        } else {
            // varsayılan (light gibi)
            $colorStyle = ' style="color:#212529"';
        }
    }

    // XML prolog IMG modunda uygun
    echo '<?xml version="1.0" encoding="UTF-8"?>' . "\n";

} else {
    // INCLUDE modu: GET bekleme. Dışarıdan şu değişkenler opsiyonel verilebilir:
    // $logoh         : yükseklik (örn 35)
    // $logocolor     : 'currentColor' ya da '#rrggbb' (vermezsen tema ile akar)
    $h        = isset($h) ? (string)$h : null;       // eğer üst sayfa set ettiyse
    $logoh    = isset($logoh) ? $logoh : null;
    $heightAttr = '';
    if ($h !== null && $h !== '') {
        $heightAttr = _attr_height_from($h, '');
    } elseif ($h === null && $logoh) {
        $heightAttr = _attr_height_from($logoh, '');
    }

    // Renk: include modunda default olarak hiç style basma -> currentColor devreye girsin
    if (isset($logocolor) && is_string($logocolor) && $logocolor !== '') {
        // '#rrggbb' veya 'currentColor' gelebilir
        $colorStyle = (strtolower($logocolor) === 'currentcolor')
            ? ' style="color:currentColor"'
            : ' style="color:' . htmlspecialchars($logocolor, ENT_QUOTES, 'UTF-8') . '"';
    } else {
        $colorStyle = ''; // hiç yazma, parent color/tema miras alsın
    }
}
?>
