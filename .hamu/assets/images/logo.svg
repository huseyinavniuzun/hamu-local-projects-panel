    <linearGradient id="deglare_2" x1="46.66" y1="6.64" x2="23.45" y2="6.64" gradientTransform="translate(19.61 1.64) rotate(45)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#376eb5"/><stop offset="1" stop-color="#438dcc"/>
    </linearGradient>
    <linearGradient id="deglare_3" x1="48.48" y1="-63.28" x2="30.61" y2="-45.41" gradientTransform="translate(8.5 -4.54) rotate(90)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#42b287"/><stop offset="1" stop-color="#078136"/>
