    <path d="M206.61,47.83h18.16l28.58,68.08h.51l28.32-68.08h18.16v89.93h-12.19V63.83h-.25l-30.36,73.92h-8.13l-30.36-73.92h-.25v73.92h-12.19V47.83Z" fill="currentColor"/>
