  <path d="M96.66,47.81v1.78h0v36.59h0v13.14h0v7.18s-.03.04-.05.02c-10.12-11.47-24.55-12.35-37.77-13.14-14.85-.89-28.88-1.73-37.64-16.32l2.48-1.24-14.06-9.47-.06-.02-.02.06-1.17,16.91,2.83-1.34c.12.32.26.63.43.93,6.73,11.69,15.69,17.04,25.19,19.66.04,0,.07.02.11.03,0,0,.34.1.48.2.3.2.5.55.5.94v34.03h12.2s.03-.01.03-.03v-32.88s.01-.03.03-.03c2.72.25,5.43.41,8.08.57,18.2,1.09,33.54,2.02,38.16,26.27.04.21.18,5.68.24,6.09,0,.01.01.02.03.02h12.23s.03-.01.03-.03V49.59h0v-1.78h-12.29Z" fill="currentColor"/>
